name = "cloud-mail"
main = "src/index.js"
compatibility_date = "2025-06-04"
keep_vars = true

[observability]
enabled = true

[[d1_databases]]
binding = "db"
database_name = "know-howflow-mail"
database_id = "0556ee53-612c-4ba9-8325-a9e717438cc3"

[[kv_namespaces]]
binding = "kv"
id = "6b77be52a575493c900256499570e1a5"

[[send_email]]
name = "forward"

[ai]
binding = "ai"

[assets]
binding = "assets"
directory = "./dist"
not_found_handling = "single-page-application"
run_worker_first = true

[triggers]
crons = ["0 * * * *"]

[vars]
domain = ["know-howflow.com"]
admin = "admin@know-howflow.com"
# Store jwt_secret as a Cloudflare runtime secret, never in this repository.

[build]
command = "pnpm --prefix ../mail-vue install && pnpm --prefix ../mail-vue run build"
